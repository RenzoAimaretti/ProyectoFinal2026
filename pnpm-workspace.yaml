packages:
  - 'packages/*'
allowBuilds:
  '@nestjs/core': set this to true or false
  '@swc/core': set this to true or false
  argon2: set this to true or false
  prisma: set this to true or false
  unrs-resolver: set this to true or false
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - '@swc/core'
  - argon2
  - bcrypt
  - prisma
  - unrs-resolver
