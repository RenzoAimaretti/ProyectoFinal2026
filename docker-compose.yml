version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proyecto-final-postgres
    environment:
      POSTGRES_DB: proyectofinal
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d proyectofinal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proyecto-final-network

networks:
  proyecto-final-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
