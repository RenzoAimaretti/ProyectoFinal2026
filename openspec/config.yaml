# openspec/config.yaml
# Project-specific SDD config — generated by sdd-init (hybrid mode)
schema: spec-driven

context: |
  Tech stack: pnpm monorepo — packages/backend (NestJS 11, Prisma 7, PostgreSQL 16, Redis, JWT auth), packages/mobile (Flutter, login+home), packages/web (Flutter skeleton). Docker compose for Postgres.
  Architecture: Hexagonal architecture refactor in progress (branch refactor/hexagonal-architecture).
  Testing: Jest 29 + ts-jest (backend), flutter_test (mobile/web).
  Style: ESLint + Prettier (backend), flutter_lints (Flutter).

strict_tdd: true

testing:
  strict_tdd: true
  primary_test_command: "pnpm --filter backend run test"
  backend:
    unit: "pnpm --filter backend run test"
    e2e: "pnpm --filter backend run test:e2e"
    coverage: "pnpm --filter backend run test:cov"
    lint: "pnpm --filter backend run lint"
  mobile:
    unit: "flutter test"
    analyze: "flutter analyze"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
